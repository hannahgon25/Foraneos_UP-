services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      # uncomment below if you want to automatically create and select a database
      # MYSQL_DATABASE: my_database
    ports:
      - "3306:3306"
    networks:
      - backend-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
  foraneos-api:
    build: ./backend/.
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - backend-network
    volumes:
      - ./backend/src:/usr/local/app # borrar despues y descomentar #COPY src/. . en backend/DOckerfile

volumes:
  mysql-data:

networks:
  backend-network:
    driver: bridge
